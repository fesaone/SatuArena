<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sistem Penalti</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  color:white;
}
.board{
  background:#1e293b;
  padding:30px;
  border-radius:20px;
  width:100%;
  max-width:800px;
  text-align:center;
}
.score-line{
  font-size:42px;
  font-weight:bold;
  margin-bottom:30px;
}
.teams{
  display:flex;
  justify-content:space-between;
  gap:30px;
  margin-bottom:24px;
}
.team{flex:1}
.team-name{
  font-size:24px;
  margin-bottom:16px;
}
.round-row{
  display:flex;
  gap:8px;
  justify-content:center;
}
.ball{
  width:26px;
  height:26px;
  border-radius:50%;
  background:#334155;
  flex-shrink:0;
}
.ball.goal{background:#22c55e}
.ball.miss{background:#ef4444}
.controls-bar{
  display:flex;
  justify-content:space-between;
  gap:30px;
  border-top:1px solid #334155;
  padding-top:20px;
  margin-bottom:20px;
}
.controls{flex:1;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
button{
  border:none;
  padding:10px 16px;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
}
.btn-goal{background:#22c55e;color:white}
.btn-miss{background:#ef4444;color:white}
.btn-remove{background:#475569;color:white}
.reset-bar{
  border-top:1px solid #334155;
  padding-top:20px;
}
.btn-reset{
  background:#7c3aed;
  color:white;
  padding:10px 28px;
  font-size:15px;
}
.btn-reset:hover{background:#6d28d9}
.confirm-box{
  display:none;
  margin-top:12px;
  font-size:14px;
  color:#94a3b8;
}
.confirm-box.show{display:block}
.btn-yes{
  background:#ef4444;
  color:white;
  padding:8px 20px;
  font-size:14px;
  margin:8px 4px 0;
}
.btn-no{
  background:#475569;
  color:white;
  padding:8px 20px;
  font-size:14px;
  margin:8px 4px 0;
}
</style>
</head>
<body>
<div class="board">
  <div class="score-line">
    [<span id="homeScore">0</span>] &nbsp;VS&nbsp; [<span id="awayScore">0</span>]
  </div>

  <!-- Bola -->
  <div class="teams">
    <div class="team">
      <div class="team-name">HOME</div>
      <div class="round-row" id="homeBalls"></div>
    </div>
    <div class="team">
      <div class="team-name">AWAY</div>
      <div class="round-row" id="awayBalls"></div>
    </div>
  </div>

  <!-- Tombol kontrol -->
  <div class="controls-bar">
    <div class="controls">
      <button class="btn-goal" onclick="addPenalty('home','goal')">Goal</button>
      <button class="btn-remove" onclick="removePenalty('home')">Undo</button>
      <button class="btn-miss" onclick="addPenalty('home','miss')">Miss</button>
    </div>
    <div class="controls">
      <button class="btn-goal" onclick="addPenalty('away','goal')">Goal</button>
      <button class="btn-remove" onclick="removePenalty('away')">Undo</button>
      <button class="btn-miss" onclick="addPenalty('away','miss')">Miss</button>
    </div>
  </div>

  <!-- Reset -->
  <div class="reset-bar">
    <button class="btn-reset" onclick="askReset()">Reset Penalti</button>
    <div class="confirm-box" id="confirmBox">
      Yakin ingin reset semua data penalti?
      <br>
      <button class="btn-yes" onclick="doReset()">Ya, Reset</button>
      <button class="btn-no" onclick="cancelReset()">Batal</button>
    </div>
  </div>
</div>

<script>
const state = { home: [], away: [] };

function render(team) {
  const ballsEl = document.getElementById(team + 'Balls');
  const scoreEl = document.getElementById(team + 'Score');
  const penalties = state[team];
  const total = penalties.length;

  const displayRound = total % 5 === 0 && total > 0
    ? Math.floor(total / 5) - 1
    : Math.floor(total / 5);

  const roundStart = displayRound * 5;
  const roundPenalties = penalties.slice(roundStart, roundStart + 5);

  ballsEl.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const ball = document.createElement('span');
    ball.classList.add('ball');
    if (roundPenalties[i] === 'goal') ball.classList.add('goal');
    else if (roundPenalties[i] === 'miss') ball.classList.add('miss');
    ballsEl.appendChild(ball);
  }

  scoreEl.textContent = penalties.filter(p => p === 'goal').length;
}

function addPenalty(team, result) {
  state[team].push(result);
  render(team);
}

function removePenalty(team) {
  state[team].pop();
  render(team);
}

function askReset() {
  document.getElementById('confirmBox').classList.add('show');
}

function cancelReset() {
  document.getElementById('confirmBox').classList.remove('show');
}

function doReset() {
  state.home = [];
  state.away = [];
  document.getElementById('confirmBox').classList.remove('show');
  render('home');
  render('away');
}

render('home');
render('away');
</script>
</body>
</html>
